name: Playwright Commerce E2E Certification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  playwright:
    name: Browser commerce certification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999

      - name: Run Playwright commerce certification
        run: npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Playwright traces, screenshots, and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          retention-days: 14
