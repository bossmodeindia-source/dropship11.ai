name: Enterprise Certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: enterprise-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  OTEL_SDK_DISABLED: true
  DOCKER_IMAGE: aiempire-backend:ci

jobs:
  certify:
    name: Build, test, security, Docker, and final certification
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check backend
        run: npx tsc --noEmit --pretty false

      - name: Build backend
        run: npm run build

      - name: Build frontend for Playwright web server
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999

      - name: Run production certification gate
        run: npm run certify

      - name: Run strict certification gate
        run: npm run certify:strict

      - name: Run Jest suite
        run: npm test -- --runInBand

      - name: Run OpenAPI contract tests
        run: npm run test:contract

      - name: Run Playwright browser certification
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999

      - name: ESLint check
        run: npm run lint:check

      - name: Prettier check
        run: npm run format:check

      - name: npm audit
        run: npm run security:audit-npm

      - name: audit-ci dependency gate
        run: npm run security:audit-ci

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Semgrep policy scan
        run: npm run security:semgrep

      - name: Install OSV Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: OSV dependency scan
        run: |
          ./osv-scanner --lockfile package-lock.json
          ./osv-scanner --lockfile frontend/package-lock.json

      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE" .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}
          trivy-config: trivy.yaml

      - name: Final certification script
        run: npm run certification:final

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/playwright
          retention-days: 14
