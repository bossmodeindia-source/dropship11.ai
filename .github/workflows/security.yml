name: Security Certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-code-security:
    name: Dependency, lint, formatting, and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint security rules
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: npm dependency audit
        run: npm audit --audit-level=high

      - name: audit-ci dependency gate
        run: npm run security:audit-ci

      - name: Install OSV Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: OSV dependency scan
        run: |
          ./osv-scanner --lockfile package-lock.json
          ./osv-scanner --lockfile frontend/package-lock.json

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Semgrep security and secret scan
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off src scripts

  trivy-security:
    name: Trivy filesystem and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trivy filesystem misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-misconfig.json
          exit-code: 0

      - name: Validate Trivy Kubernetes misconfigurations
        run: node scripts/validate-trivy-misconfig.js trivy-misconfig.json

      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          trivy-config: trivy.yaml

  secret-security:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
